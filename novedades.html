         sino una bienvenida al sitio, con lo que hay en cada sección.
         De fondo, el MISMO carrusel de fotos de la intro de El taller
         (una cada 4 s, fundido; lo mueve iniciarCarruselIntro en
         js/sitio.js). Si agregas o quitas fotos allá, cámbialas aquí
         también: la lista está repetida en taller.html. Todo el cuadro
         lleva a El taller. Los textos van en data-es / data-en, igual
         que en taller.html: escríbelos con tus palabras cuando quieras.
         El carrusel de novedades (novedad:true en datos/trabajos.js)
         sigue en sitio.js (montarCarrusel), sin usarse por ahora. -->

        </div>

          <span class="novedad__etiqueta" data-es="Bienvenida" data-en="Welcome"></span>

            <li><b data-es="Tu pedido" data-en="Your order"></b><span data-es="La bolsa de arriba guarda lo que agregas desde Prototipos. Al concretar se abre WhatsApp con el pedido ya escrito." data-en="The bag up top keeps what you add from Prototypes. Checking out opens WhatsApp with the order already written."></span></li>
            <li><b data-es="Exhibición" data-en="Exhibition"></b><span data-es="Trabajos hechos por encargo, para ver lo que ha salido del taller." data-en="Commissioned work, to see what has come out of the shop."></span></li>
            <li><b data-es="El taller" data-en="The shop"></b><span data-es="Quién soy, cómo funciona un encargo y con qué maderas trabajo." data-en="Who I am, how a commission works and which woods I use."></span></li>
            <li><b data-es="Novedades" data-en="What's new"></b><span data-es="Lo último del taller. Estás aquí." data-en="The latest from the shop. You are here."></span></li>
