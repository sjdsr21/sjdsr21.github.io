<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No encontrado — prototipo ago</title>
  <link rel="icon" href="/favicon.ico?v=ago" sizes="48x48">
  <meta name="theme-color" content="#2A2318">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/escaner.css">
</head>
<!-- 2026-08-17 - Decía data-pagina="taller" y eso hacía que al
     cargar corriera paginas.taller(), que lo primero que hace es
     escribir en #titulo. Aquí no hay #titulo, así que reventaba con
     un TypeError antes de traducir nada: la página se quedaba
     siempre en español aunque el sitio estuviera en inglés.
     "noencontrado" no está en el mapa `paginas`, o sea que no corre
     ninguna función de página - que es lo correcto: el texto de
     aquí es fijo y está escrito en el HTML. -->
<body data-pagina="noencontrado">

  <header id="cabecera"></header>

  <main class="contenedor">
    <section class="portada">
      <h1>Esta página no existe</h1>
      <p class="bajada">Puede que el enlace esté viejo o mal copiado. Desde el inicio se llega a todo.</p>
      <div class="acciones">
        <a class="boton" href="index.html">Ir al inicio</a>
        <a class="boton boton--linea" href="trabajos.html">Ver el portafolio</a>
      </div>
    </section>
  </main>

  <footer id="pie"></footer>
  <script src="datos/imagenes.js"></script>

  <script src="datos/marca.js"></script>
  <script src="datos/textos.js"></script>
  <script src="datos/trabajos.js"></script>
  <script src="datos/tienda.js"></script>
  <script src="datos/prototipos.js"></script>
  <script src="datos/busqueda.js"></script>
  <script src="js/sitio.js"></script>
  <!-- al final del todo: mide la pagina YA pintada -->
  <script src="js/escaner.js"></script>
</body>
</html>
