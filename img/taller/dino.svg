  <style>

svg { fill: #ffe829; }
.ojo { fill: #d9860b; }
.pose, .fotograma { opacity: 0; }
.base { opacity: 1; }
.ojo-izquierdo { animation: girar 14s steps(1, end) infinite; }
@keyframes girar { 0%,48%,90%,100% { opacity:1; } 28%,73% { opacity:0; } }
.pose-0 { animation: pose-0 32s steps(1, end) infinite; }
@keyframes pose-0 { 0% { opacity:1; } 60% { opacity:0; } 61.5% { opacity:0; } 79% { opacity:0; } 80.5% { opacity:1; } 100% { opacity:1; } }
.pose-1 { animation: pose-1 32s steps(1, end) infinite; }
@keyframes pose-1 { 0% { opacity:0; } 60% { opacity:1; } 61.5% { opacity:0; } 79% { opacity:1; } 80.5% { opacity:0; } 100% { opacity:0; } }
.pose-2 { animation: pose-2 32s steps(1, end) infinite; }
@keyframes pose-2 { 0% { opacity:0; } 60% { opacity:0; } 61.5% { opacity:1; } 79% { opacity:0; } 80.5% { opacity:0; } 100% { opacity:0; } }
.cuerpo-0 { animation: cuerpo-0 6.4s steps(1, end) infinite; }
@keyframes cuerpo-0 { 0% { opacity:1; } 12.5% { opacity:0; } 16.25% { opacity:0; } 33.75% { opacity:0; } 37.5% { opacity:1; } 100% { opacity:1; } }
.cuerpo-1 { animation: cuerpo-1 6.4s steps(1, end) infinite; }
@keyframes cuerpo-1 { 0% { opacity:0; } 12.5% { opacity:1; } 16.25% { opacity:0; } 33.75% { opacity:1; } 37.5% { opacity:0; } 100% { opacity:0; } }
.cuerpo-2 { animation: cuerpo-2 6.4s steps(1, end) infinite; }
@keyframes cuerpo-2 { 0% { opacity:0; } 12.5% { opacity:0; } 16.25% { opacity:1; } 33.75% { opacity:0; } 37.5% { opacity:0; } 100% { opacity:0; } }

.cabeza { animation: cabecear 6.4s steps(2, end) infinite; }
@keyframes cabecear {
  0%, 12.5%, 43.75%, 100% { transform: translateY(0); }
  22.5%, 33.75% { transform: translateY(-1px); }
}

@media (prefers-reduced-motion: reduce) { .pose, .fotograma, .cabeza, .ojo-izquierdo { animation:none; } }
</style>
