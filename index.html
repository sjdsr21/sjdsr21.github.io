<html lang="es">
<head>
  <meta charset="utf-8">

      { "@type": "FurnitureStore", "@id": "https://prototipoago.com/#taller",

        "url": "https://prototipoago.com/",

        "image": "https://prototipoago.com/img/marca/vista-previa.jpg",
        "telephone": "+584120152753",

    ]
  }
  </script>
  <meta name="theme-color" content="#000000">

  <!-- Tarjeta que sale al pegar el enlace en WhatsApp y redes.
       La imagen TIENE que ir con direccion absoluta. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Prototipo Ago">
  <meta property="og:locale" content="es_VE">
  <meta property="og:title" content="Prototipos — Prototipo Ago">
  <meta property="og:description" content="Piezas hechas en Caracas: desde tablas de picar hasta gabinetes.">
  <meta property="og:image" content="https://prototipoago.com/img/marca/vista-previa.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="canonical" href="https://prototipoago.com/">
  <meta property="og:url" content="https://prototipoago.com/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Prototipos — Prototipo Ago">
  <meta name="twitter:description" content="Piezas hechas en Caracas: desde tablas de picar hasta gabinetes.">
  <meta name="twitter:image" content="https://prototipoago.com/img/marca/vista-previa.jpg">
<!-- meta:fin -->
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/escaner.css">
  <link rel="stylesheet" href="css/prototipos.css">
  <link rel="stylesheet" href="css/diagramas.css">
</head>
<body data-pagina="prototipos">

  <header id="cabecera"></header>

  <main class="contenedor">

    <section class="portada">
      <!-- 15/09/2026 · La barra de vistas, filtros y orden. Manda sobre
           LAS DOS cuadrículas —«Listas ahora» y «Por encargo»—, por eso
           vive fuera de ellas. Y va dentro de la portada, en la misma
           fila que el título, para no gastar una franja entera de alto
           (él). La pinta js/prototipos.js; si está vacía, ese JS no
           corrió. -->
      <div class="portada__barra" id="pt-barra"></div>
      <h1 id="pt-titulo"></h1>
      <p class="bajada" id="pt-bajada"></p>
    </section>

    <!-- ---------- listas ahora ---------- -->
    <section class="pt-seccion">
      <div class="pt-cabeza">
        <h2 id="pt-tit-stock"></h2>
        <span class="pt-cuenta" id="pt-n-stock"></span>
      </div>
      <!-- 15/09/2026 · Fuera la bajada («En inventario. Sin tiempo de
           espera…»): él la quitó porque «Listas ahora» ya se explica
           solo. Si vuelve, hay que reponer también la línea que la
           rellenaba en js/prototipos.js. -->
      <div class="rejilla" id="pt-stock"></div>
    </section>

    <!-- ---------- por encargo ---------- -->
    <section class="pt-seccion">
      <div class="pt-cabeza">
        <h2 id="pt-tit-pedido"></h2>
        <span class="pt-cuenta" id="pt-n-pedido"></span>
      </div>
      <!-- Fuera la bajada, igual que en «Listas ahora» (él, 15/09/2026). -->
      <div class="rejilla" id="pt-pedido"></div>
    </section>

    <!-- ---------- el pedido ---------- -->
    <section class="pt-seccion" id="pt-pedido-seccion">
      <!-- La raya de arriba y la bolsa junto al título: él, 16/09/2026. -->
      <div class="pt-cabeza"><h2 id="pt-tit-pedidoc"></h2><span class="pt-bolsa" id="pt-bolsa-pedido" aria-hidden="true"></span></div>
      <p class="pt-bajada" id="pt-baj-pedidoc"></p>

      <div class="pt-cols">
        <div class="pt-col">
          <div id="pt-lineas"></div>

          <div class="pt-campo" style="margin-top:1.9rem">
            <span class="pt-etiqueta" id="pt-l-recibes"></span>
            <div class="pt-radios" id="pt-entrega"></div>
            <div id="pt-zona-estado" style="margin-top:.75rem;display:none">
              <select class="pt-select" id="pt-estado"></select>
            </div>
          </div>

          <div class="pt-campo" style="margin-bottom:0">
            <span class="pt-etiqueta" id="pt-l-pagas"></span>
            <div class="pt-radios" id="pt-pago"></div>
            <small class="pt-nota" id="pt-nota-datos"></small>
          </div>
        </div>

        <div class="pt-col">
          <!-- La tasa del día vive aquí, arriba a la derecha del
               recuadro del pedido: es donde hace falta, junto a las
               cifras en bolívares. Antes estaba en la cabecera del
               catálogo, lejos de todo lo que explica. -->
          <span class="pt-tasa" id="pt-tasa"></span>

          <div class="pt-fila">
            <span class="et" id="pt-l-piezas"></span>
            <span id="pt-suma"></span>
          </div>

          <div class="pt-fila pt-fila--grande">
            <span class="et" id="pt-l-total"></span>
            <span style="text-align:right">
              <span class="n" id="pt-total-principal"></span>
              <span class="pt-gris" id="pt-total-secundario"></span>
            </span>
          </div>

          <!-- El envío va aparte porque es cobro destino: lo cobra
               la agencia al entregarlo, no él. No suma al total. -->
          <div class="pt-aparte" id="pt-caja-envio" style="display:none">
            <div class="pt-aparte__top">
              <span id="pt-l-envio"></span>
              <b id="pt-envio-monto"></b>
            </div>
            <span class="pt-gris" id="pt-envio-bs" style="text-align:left"></span>
            <small id="pt-envio-nota"></small>
          </div>

          <span class="pt-etiqueta" id="pt-l-previa" style="margin-top:1.4rem"></span>
          <div class="pt-previa" id="pt-previa"></div>

          <button class="pt-btn pt-btn--wa" id="pt-pedir" style="margin-top:1rem" disabled></button>
          <small class="pt-nota" id="pt-nota-pedir"></small>
        </div>
      </div>
    </section>

  </main>

  <footer id="pie"></footer>

  <!-- panel lateral de configuración -->
  <div class="pt-velo" id="pt-velo"></div>
  <!-- aria-hidden lo maneja el JS al abrir y cerrar: si se deja
       fijo en "true", el panel entero es invisible para un lector
       de pantalla AUNQUE esté abierto, y con él todo el flujo de
       compra. Es un diálogo, así que lleva role y aria-modal, y se
       nombra con su propio título. -->
  <aside class="pt-panel" id="pt-panel" aria-hidden="true"
         role="dialog" aria-modal="true" aria-labelledby="pt-pn-titulo">
    <div class="pt-panel__cab">
      <h3 id="pt-pn-titulo"></h3>
      <button class="pt-cerrar" id="pt-pn-cerrar" type="button" aria-label="Cerrar">&times;</button>
    </div>
    <div class="pt-panel__cuerpo">

      <!-- Columna izquierda: la visual de lo que estás escogiendo.
           Si la variante tiene modelo 3D se monta el visor; si no,
           queda el recuadro rayado de "sin imagen". -->
      <div class="pt-panel__visual">
        <div class="pt-visual" id="pt-pn-visual">
          <div class="pt-visual__lienzo" id="pt-pn-lienzo"></div>
        </div>
        <!-- 2026-08-17 - Las miniaturas de los medios. Estaban DENTRO
             de .pt-visual, flotando arriba a la izquierda encima de la
             foto: tapaban la pieza y eran de 42px. Ahora cuelgan de
             .pt-panel__visual, o sea DEBAJO del recuadro, en
             cuadricula y mas grandes. Fuera de .pt-visual a proposito:
             ese contenedor lleva aspect-ratio y position:relative, y
             desde dentro no hay forma de quedar debajo.
             El id no cambia, asi que js/prototipos.js las sigue
             encontrando igual. Se ocultan si solo hay un medio. -->
        <div class="pt-medios" id="pt-pn-medios" hidden></div>
      </div>

      <!-- Columna derecha: lo que se configura -->
      <div class="pt-panel__opciones">
        <p class="pt-panel__resumen" id="pt-pn-resumen"></p>
        <div id="pt-pn-opciones"></div>
        <div class="pt-grupo" style="margin-bottom:0">
          <span class="pt-etiqueta" id="pt-pn-etiqueta-cant"></span>
          <div class="pt-contador">
            <button type="button" id="pt-pn-menos">&minus;</button>
            <span id="pt-pn-cant">1</span>
            <button type="button" id="pt-pn-mas">+</button>
          </div>
          <div class="pt-nota-pack" id="pt-pn-nota-pack"></div>
          <div class="pt-nota-stock" id="pt-pn-nota-stock"></div>
        </div>
      </div>
    </div>
    <div class="pt-panel__pie">
      <div class="pt-precio-panel">
        <span class="n" id="pt-pn-precio"></span>
        <span class="bs" id="pt-pn-precio-bs"></span>
      </div>
      <!-- Dos botones: el de la izquierda agrega y te deja donde
           estabas, el de la derecha agrega y baja al pedido. -->
      <div class="pt-acciones">
        <button class="pt-btn pt-btn--linea" id="pt-pn-agregar-seguir" type="button"></button>
        <button class="pt-btn" id="pt-pn-agregar" type="button"></button>
      </div>
    </div>
  </aside>
  <script src="datos/imagenes.js"></script>

  <script src="datos/marca.js"></script>
  <script src="datos/textos.js"></script>
  <script src="datos/trabajos.js"></script>
  <script src="datos/tienda.js"></script>
  <script src="datos/prototipos.js"></script>
  <script src="datos/busqueda.js"></script>
  <script src="datos/envios.js"></script>
  <script src="datos/modelos.js"></script>
  <script src="js/visor3d.js"></script>
  <script src="js/diagramas.js"></script>
  <script src="js/sitio.js"></script>
  <script src="js/prototipos.js"></script>
  <!-- al final del todo: mide la pagina YA pintada -->
  <script src="js/escaner.js"></script>
<script src="asistente/widget.js" defer></script></body>
</html>
