<body data-pagina="contacto">

  <header id="cabecera"></header>

  <main class="contenedor">

    <section class="portada">
      <h1 id="titulo"></h1>
      <p class="bajada" id="bajada"></p>
    </section>

    <div class="contactos" id="contactos"></div>

    <section class="seccion">
      <div class="prosa" data-es="
        <h2>Dónde estoy</h2>
        <p>El taller está en Caracas, en la zona 1080. Trabajo con cita: escríbeme antes de pasar.</p>
      " data-en="
        <h2>Where I am</h2>
        <p>The shop is in Caracas, in postal zone 1080. I work by appointment: write me before dropping by.</p>
      "></div>

      <!-- ==========================================================
           Mapa dibujado a mano, no es cartografía. Da la idea de
           dónde queda la zona 1080 dentro del valle de Caracas,
           con el Ávila cerrando por el norte. No sirve para
           orientarse en la calle: para eso está el WhatsApp.
           ========================================================== -->
      <figure class="mapa">
        <svg viewBox="0 0 800 505" role="img"
             aria-label="Mapa esquemático de Caracas: el Ávila al norte y los sectores del valle, con la zona del taller señalada alrededor de La Trinidad">

          <rect width="800" height="505" fill="#F1E9DA"/>

          <!-- ===== El Ávila =====================================
               Trazado siguiendo el borde del parque en el mapa de
               referencia: baja en diente hacia el valle y se
               derrama por el lado este. Sin nombre a propósito. -->
          <path d="M0 0 H800 V78
                   C778 84 764 52 748 45
                   C722 34 700 44 677 34
                   C650 22 640 46 624 41
                   C598 33 585 26 571 30
                   C548 37 536 30 526 23
                   C508 11 500 20 496 15
                   C478 -4 466 26 451 26
                   C436 26 430 40 421 34
                   C406 24 400 15 391 23
                   C374 38 356 6 338 11
                   C318 17 306 3 286 8
                   C262 14 246 24 226 19
                   C202 13 176 6 150 11
                   C118 17 100 22 75 15
                   C50 8 24 4 0 8 Z"
                fill="#7F8D66"/>

          <!-- picos menudos, de tamaños distintos -->
          <g fill="none" stroke="#63714B" stroke-width="1.7"
             stroke-linejoin="round" stroke-linecap="round" opacity=".8">
            <path d="M10 -2 l9 -12 l9 12"/>   <path d="M32 2 l6 -8 l6 8"/>
            <path d="M52 -4 l12 -17 l12 17"/> <path d="M82 4 l7 -10 l7 10"/>
            <path d="M104 -1 l10 -14 l10 14"/><path d="M132 6 l6 -9 l6 9"/>
            <path d="M154 0 l13 -18 l13 18"/> <path d="M186 8 l8 -11 l8 11"/>
            <path d="M210 4 l6 -8 l6 8"/>     <path d="M232 -2 l11 -16 l11 16"/>
            <path d="M262 8 l8 -10 l8 10"/>   <path d="M284 0 l10 -14 l10 14"/>
            <path d="M312 6 l6 -9 l6 9"/>     <path d="M334 -4 l14 -20 l14 20"/>
            <path d="M368 6 l8 -11 l8 11"/>   <path d="M392 -1 l11 -15 l11 15"/>
            <path d="M420 8 l7 -9 l7 9"/>     <path d="M442 2 l9 -13 l9 13"/>
            <path d="M468 -4 l13 -18 l13 18"/><path d="M500 6 l6 -9 l6 9"/>
            <path d="M522 0 l11 -15 l11 15"/> <path d="M552 -2 l8 -12 l8 12"/>
            <path d="M574 6 l10 -13 l10 13"/> <path d="M604 -8 l15 -22 l15 22"/>
            <path d="M640 4 l7 -10 l7 10"/>   <path d="M662 -2 l12 -17 l12 17"/>
            <path d="M694 8 l6 -9 l6 9"/>     <path d="M716 0 l11 -15 l11 15"/>
            <path d="M746 6 l8 -11 l8 11"/>   <path d="M770 -2 l10 -14 l10 14"/>
          </g>

          <!-- verde del sureste, hacia El Hatillo -->
          <path d="M800 505 V352 C760 356 730 384 706 392
                   C676 402 660 430 664 456 C668 480 690 496 720 505 Z"
                fill="#8B9772" opacity=".55"/>
          <path d="M0 505 V468 C34 462 62 476 78 494 C86 498 92 502 96 505 Z"
                fill="#8B9772" opacity=".45"/>

          <!-- ===== Vías ========================================= -->
          <g fill="none" stroke="#C8BEAA" stroke-linecap="round" stroke-linejoin="round">
            <!-- Cota Mil, pegada al pie del cerro -->
            <path d="M188 34 C248 24 300 20 340 26 C392 34 440 44 486 56
                     C528 67 560 78 592 92" stroke-width="6"/>
            <!-- Francisco Fajardo: la que cruza el valle -->
            <path d="M0 143 C60 152 110 164 170 178 C226 190 276 196 316 192
                     C368 186 420 174 466 173 C526 172 572 182 616 184
                     C680 187 740 190 800 196" stroke-width="10"/>
            <!-- distribuidor y bajada hacia el sur -->
            <path d="M323 200 C298 236 296 268 310 300 C326 336 334 356 338 383
                     C343 416 356 444 380 470" stroke-width="8"/>
            <!-- Prados del Este -->
            <path d="M400 186 C428 232 448 268 468 316 C488 364 502 402 516 442" stroke-width="7"/>
            <!-- ramal del este -->
            <path d="M540 180 C588 214 628 258 660 306 C686 346 700 372 712 396" stroke-width="6"/>
            <!-- salida oeste -->
            <path d="M118 186 C150 236 188 300 226 356 C250 392 264 424 272 452" stroke-width="6"/>

            <path d="M372 254 C346 292 330 330 330 366" stroke-width="5"/>

            <path d="M362 402 C420 414 476 420 528 424 C560 427 584 432 604 440" stroke-width="5.5"/>
          </g>

          <!-- ===== Sectores ==================================== -->
          <g font-size="17" font-weight="700" fill="#4A3B2A" letter-spacing=".4">
            <circle cx="199" cy="118" r="5" fill="#8A7862"/>
            <text x="213" y="124">San Bernardino</text>

            <circle cx="397" cy="150" r="5" fill="#8A7862"/>
            <text x="411" y="156">Chacao</text>

            <circle cx="586" cy="160" r="5" fill="#8A7862"/>
            <text x="600" y="166">Boleíta</text>

            <circle cx="372" cy="230" r="5" fill="#8A7862"/>
            <text x="386" y="236">Las Mercedes</text>

            <circle cx="562" cy="428" r="5" fill="#8A7862"/>
            <text x="576" y="434">El Hatillo</text>
          </g>

          <!-- ===== La zona del taller ========================== -->
          <circle cx="330" cy="410" r="96"
                  fill="var(--realce-vivo)" fill-opacity=".10"
                  stroke="var(--realce)" stroke-width="3.5"/>
          <circle cx="330" cy="382" r="5" fill="var(--realce)"/>
          <text x="344" y="388" font-size="17" font-weight="700"
                fill="var(--realce)" letter-spacing=".4">La Trinidad</text>
        </svg>
        <figcaption data-es="El taller queda en esa zona, entre La Trinidad y lo que baja de ahí. La dirección exacta te la paso por mensaje cuando acordemos la visita."
                    data-en="The shop is in that area, around La Trinidad and just south of it. I'll send you the exact address by message when we arrange a visit."></figcaption>
