      <div class="prosa" data-es="
        <p>Soy Santiago. Trabajo la madera en Caracas, en un espacio que era un simple depósito y que he ido habilitando poco a poco: primero para que cupieran las herramientas, después para que fuera un sitio cómodo donde crear sin tantas limitaciones.</p>
        <p>Aprendí solo, con ayuda de YouTube, haciendo, equivocándome y rehaciendo. No vengo de una escuela de ebanistería ni de una familia de ebanistas: vengo de trabajar en un estacionamiento y de muchas horas averiguando por qué una pieza salió torcida, o por qué una idea funcionaba mejor en mi cabeza.</p>
        <p>De ahí sale el nombre. Prototipar es hacer una primera versión de algo y mejorarla en la siguiente. Es como trabajo y es como aprendí.</p>
      " data-en="
        <p>I'm Santiago. I work wood in Caracas, in a space that was just a storage room and that I've been fitting out little by little: first so the tools would fit, then so it would be a comfortable place to make things without so many limits.</p>
        <p>I taught myself, with YouTube's help — by doing it, getting it wrong, and doing it again. I didn't come out of a cabinetmaking school or a family of cabinetmakers: I came out of working in a parking garage and a lot of hours working out why a piece came out crooked, or why an idea worked better in my head.</p>
        <p>That's where the name comes from. To prototype is to make a first version of something and improve it on the next one. It's how I work and it's how I learned.</p>
      "></div>
    </section>

    <!-- ---------- El encargo ---------- -->
    <section class="seccion">
      <h2 data-es="Cómo funciona un encargo" data-en="How a commission works"></h2>

      <!-- 2026-08-12 · Reescrito por él. Cambios de fondo, no de
           estilo: el plazo cuenta desde el anticipo (no desde la
           aprobación), entró un paso nuevo de avances, y la
           entrega dejó de prometer montaje siempre — depende de lo
           que se acuerde al principio. -->
      <ol class="pasos" data-es="
        <li><strong>Me escribes con la idea</strong>Aunque esté incompleta. Una foto de referencia, el espacio donde va, medidas aproximadas: todo eso ayuda muchísimo.</li>
        <li><strong>Lo dibujo</strong>Te mando una representación visual en 3D, con las medidas reales aproximadas, para que veas la pieza antes de que exista. Si hay que ajustarle algo, se ajusta aquí.</li>
        <li><strong>Presupuesto en firme</strong>Una sola cifra, sin elementos escondidos. Lleva fecha de validez porque el material se mueve, no por apurarte. <a href='#propuesta'>Mira cómo es una propuesta</a>.</li>
        <li><strong>Anticipo y arranque</strong>50% para arrancar y 50% contra entrega. El tiempo de entrega se cuenta desde el anticipo de arranque, no desde que apruebas: el material se compra con ese anticipo.</li>
        <li><strong>Te voy contando</strong>Mientras la pieza se hace, te mando avances: cómo va quedando, en qué punto está y cualquier decisión que valga la pena consultarte por el camino.</li>
        <li><strong>Entrega</strong>Según lo que hayamos acordado al principio, llevo la pieza y la monto, la dejo anclada donde va, o te la entrego lista para que la recibas como prefieras.</li>
      " data-en="
        <li><strong>You write me with the idea</strong>Even if it's incomplete. A reference photo, the space it goes in, rough measurements: all of it helps enormously.</li>
        <li><strong>I draw it</strong>I send you a visual 3D representation, at approximate real dimensions, so you see the piece before it exists. If something needs adjusting, it gets adjusted here.</li>
        <li><strong>A firm quote</strong>One single figure, with nothing hidden in it. It carries an expiry date because material prices move, not to rush you. <a href='#propuesta'>See what a proposal looks like</a>.</li>
        <li><strong>Deposit and start</strong>50% to start, 50% on delivery. The lead time counts from the starting deposit, not from your approval: the material is bought with that deposit.</li>
        <li><strong>I keep you posted</strong>While the piece is being made I send you progress: how it's coming along, where it stands, and any decision worth checking with you along the way.</li>
        <li><strong>Delivery</strong>Depending on what we agreed at the start, I bring the piece and mount it, leave it anchored where it goes, or hand it over ready for you to receive however suits you.</li>
      "></ol>
    </section>

    <!-- ---------- Materiales ---------- -->
    <section class="seccion">
      <h2 data-es="Con qué trabajo" data-en="What I work with"></h2>
      <!-- 2026-08-14 · Reordenado por él: primero la madera
           sólida, luego los aglomerados, luego metales y por
           último pintura y barnices. Antes iba mezclado y el
           contraenchapado abría la lista. -->
      <ul class="lista-marcas" data-es="
        <li><b>Madera sólida</b><span>Pino macizo para estructuras, listones y todo lo que tenga que cargar; con el tiempo toma un tono más dorado. Y samán, dura y de veta muy marcada, para piezas pequeñas donde la madera es la protagonista.</span></li>
        <li><b>Aglomerados</b><span>Contraenchapados, compuestos, MDF, melamina y similares. Son el caballo de batalla: estables, aguantan peso y no trabajan como la tabla maciza. De aquí sale la mayoría de los muebles.</span></li>
        <li><b>Metales</b><span>Herrería ligera: manejo las máquinas de soldar, y trabajo el hierro y el aluminio. Para bases, estructuras y refuerzos donde la madera sola no da.</span></li>
        <li><b>Pintura y barnices</b><span>Crudo, sellado, laca, poliuretano o aceite de linaza. Cada uno cambia el precio y cambia cómo envejece la pieza; lo conversamos según dónde va a vivir.</span></li>
      " data-en="
        <li><b>Solid wood</b><span>Solid pine for structure, rails and anything that has to carry load; it takes on a more golden tone over time. And samán, hard and strongly grained, for small pieces where the wood is the point.</span></li>
        <li><b>Engineered boards</b><span>Plywood, composites, MDF, melamine and the like. They're the workhorse: stable, they carry weight and they don't move the way solid board does. Most of the furniture comes from here.</span></li>
        <li><b>Metals</b><span>Light metalwork: I run the welders, and I work iron and aluminium. For bases, frames and reinforcement where wood alone won't do.</span></li>
        <li><b>Paint and varnish</b><span>Unfinished, sealed, lacquered, polyurethane or linseed oil. Each one changes the price and changes how the piece ages; we talk it through based on where it's going to live.</span></li>
      "></ul>
    </section>

    <!-- ---------- Las maderas ----------
         2026-08-16 · Sección nueva. Es el destino del enlace que llevan
         todas las fichas de Prototipos («cualquier pieza se puede hacer
         en otra madera»), así que el id `maderas` NO se cambia.

         SIN FOTOS a propósito, decisión suya: publicar imágenes de otro

         Los datos son de dominio público (especie, color, dureza

    <section class="seccion" id="maderas">
      <h2 data-es="Las maderas" data-en="The woods"></h2>
      <p data-es="Estas son las especies con las que trabajo normalmente. Casi cualquier pieza del catálogo se puede hacer en otra de ellas — cambia el precio, el peso y el carácter, y lo conversamos antes."
         data-en="These are the species I normally work with. Almost any piece in the catalogue can be made in a different one — it changes the price, the weight and the character, and we talk it through first."></p>

      <ul class="maderas" data-es="
        <li><i style=&quot;--m:#D9B77A&quot;></i><b>Pino</b><em>Pinus caribaea · Pino Caribe</em><span>Blanda y liviana, de veta recta y nudos vivos. Es la de estructura: barata, fácil de trabajar y de repuesto seguro. Con los años dora.</span></li>
        <li><i style=&quot;--m:#7F5435&quot;></i><b>Samán</b><em>Samanea saman</em><span>Dura, pesada y de veta muy marcada, con el albura clara contrastando contra un corazón chocolate. Cuando la madera es lo que se mira, es ésta.</span></li>
        <li><i style=&quot;--m:#C9A882&quot;></i><b>Apamate</b><em>Tabebuia rosea</em><span>Dureza media y tono rosado tostado, de veta tranquila. Estable y agradecida al cepillo; buena para piezas que se tocan mucho.</span></li>
        <li><i style=&quot;--m:#A9673C&quot;></i><b>Cedro</b><em>Cedrela odorata</em><span>Liviana para lo rojiza que es, aromática, y de las más nobles para tallar. Clásica de mueblería fina. Se raya con facilidad: no es para una tabla de picar.</span></li>
        <li><i style=&quot;--m:#8A6B2F&quot;></i><b>Puy</b><em>Tabebuia serratifolia</em><span>Muy dura y densa, pardo oliva. Aguanta a la intemperie y el uso rudo mejor que casi cualquier otra de aquí. Cuesta trabajarla, y se nota en el filo de las herramientas.</span></li>
        <li><i style=&quot;--m:#A9814B&quot;></i><b>Teca</b><em>Tectona grandis</em><span>Dorada, grasosa al tacto por sus aceites naturales, y la más estable de todas frente a la humedad. Por eso es la de cocina y la de exterior.</span></li>
        <li><i style=&quot;--m:#8B4A2B&quot;></i><b>Algarrobo</b><em>Hymenaea courbaril</em><span>Muy dura y pesada, de un rojo anaranjado que se oscurece con la luz. Pesa de verdad: una tabla grande se siente en la mano.</span></li>
        <li><i style=&quot;--m:#6B3F7A&quot;></i><b>Nazareno</b><em>Peltogyne spp.</em><span>La morada. Sale parda del corte y vira a violeta con el aire, luego calma hacia un vino oscuro. Muy dura. Se usa poco y en poca cantidad, como acento.</span></li>
        <li><i style=&quot;--m:#D8C39A&quot;></i><b>Melina</b><em>Gmelina arborea</em><span>Clara, liviana y de crecimiento rápido, con veta discreta. Alternativa al pino cuando se quiere un tono más pálido y parejo.</span></li>
      " data-en="
        <li><i style=&quot;--m:#D9B77A&quot;></i><b>Pine</b><em>Pinus caribaea · Caribbean pine</em><span>Soft and light, straight-grained with live knots. This is the structural one: cheap, easy to work and easy to replace. It turns golden over the years.</span></li>
        <li><i style=&quot;--m:#7F5435&quot;></i><b>Monkeypod</b><em>Samanea saman</em><span>Hard, heavy and strongly figured, pale sapwood set against a chocolate heart. When the wood is the thing you look at, it's this one.</span></li>
        <li><i style=&quot;--m:#C9A882&quot;></i><b>Apamate</b><em>Tabebuia rosea</em><span>Medium hardness, a toasted rose tone and quiet grain. Stable and rewarding under the plane; good for pieces that get handled a lot.</span></li>
        <li><i style=&quot;--m:#A9673C&quot;></i><b>Spanish cedar</b><em>Cedrela odorata</em><span>Light for how red it is, aromatic, and one of the finest to carve. A classic of good cabinetwork. It marks easily, so not for a cutting board.</span></li>
        <li><i style=&quot;--m:#8A6B2F&quot;></i><b>Ipê</b><em>Tabebuia serratifolia</em><span>Very hard and dense, olive brown. It stands up to weather and rough use better than almost anything else here. Hard on tools, and you feel it on the edge.</span></li>
        <li><i style=&quot;--m:#A9814B&quot;></i><b>Teak</b><em>Tectona grandis</em><span>Golden, faintly oily to the touch from its natural resins, and the most stable of all against moisture. That's why it's the kitchen and outdoor wood.</span></li>
        <li><i style=&quot;--m:#8B4A2B&quot;></i><b>Jatoba</b><em>Hymenaea courbaril</em><span>Very hard and heavy, an orange red that darkens with light. It genuinely weighs: you feel a large board in the hand.</span></li>
        <li><i style=&quot;--m:#6B3F7A&quot;></i><b>Purpleheart</b><em>Peltogyne spp.</em><span>The purple one. It comes off the saw brown, turns violet in the air, then settles toward dark wine. Very hard. Used sparingly, as an accent.</span></li>
        <li><i style=&quot;--m:#D8C39A&quot;></i><b>Gmelina</b><em>Gmelina arborea</em><span>Pale, light and fast-growing, with discreet grain. An alternative to pine when you want a paler, more even tone.</span></li>
      "></ul>
    </section>
