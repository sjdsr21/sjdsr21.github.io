    <!-- ==========================================================

    <section class="portada">
      <h1 id="titulo"></h1>
    </section>

    <section class="intro-taller">
      <div>
        <img class="retrato" src="img/marca/retrato.jpg" alt="Santiago en el taller">
        <p class="pie-foto" data-es="Caracas. El fondo es contraenchapado de pino, del que sale casi todo."
                            data-en="Caracas. The backdrop is pine plywood, which most of the work comes out of."></p>
      </div>

      <div class="prosa" data-es="
        <p>Soy Santiago. Trabajo la madera en Caracas, en un taller que era de mi papá y que llevo por mi cuenta desde hace un par de años.</p>
        <p>Aprendí solo, haciendo, equivocándome y rehaciendo. No vengo de una escuela de ebanistería ni de una familia de ebanistas: vengo de un galpón con máquinas y de muchas horas averiguando por qué una pieza salió torcida.</p>
        <p>Eso me dejó una manía útil. Antes de cortar la primera tabla, el mueble ya existe completo en tres dimensiones, con sus medidas reales y cada pieza en su sitio. De ahí sale todo lo demás: el despiece, el plano de corte y el precio.</p>
        <p>No es por sofisticación. Es que así sé exactamente qué material entra, cuánto sobra y cuánto cuesta antes de comprometerme con una cifra. Y así el presupuesto que te doy es el que se cobra.</p>
      " data-en="
        <p>I'm Santiago. I work wood in Caracas, in a shop that was my father's and that I've run on my own for a couple of years.</p>
        <p>I taught myself — by doing it, getting it wrong, and doing it again. I didn't come out of a cabinetmaking school or a family of cabinetmakers: I came out of a shed full of machines and a lot of hours working out why a piece came out crooked.</p>
        <p>That left me with a useful habit. Before the first board is cut, the piece already exists in full 3D, at real dimensions, every part in place. Everything else comes from there: the cut list, the cutting diagram, and the price.</p>
        <p>It isn't for sophistication's sake. It's how I know exactly what material goes in, what's left over and what it costs before I commit to a figure. And it's why the quote I hand you is the one you pay.</p>
      "></div>
    </section>

    <!-- ---------- Cómo trabajo ---------- -->
    <section class="seccion">
      <h2 data-es="Cómo trabajo" data-en="How I work"></h2>
      <div class="dos-columnas" data-es="
        <div><h3>Se dibuja antes de cortar</h3><p>Cada encargo se modela entero en 3D. Ves la pieza terminada, con sus medidas, antes de que exista y antes de pagar nada.</p></div>
        <div><h3>El corte se optimiza</h3><p>El despiece pasa por un optimizador que acomoda todas las piezas en las láminas. Menos desperdicio es menos material que pagas.</p></div>
        <div><h3>Una sola cifra</h3><p>El presupuesto va cerrado, con la entrega incluida. Sin renglones sueltos que aparecen al final.</p></div>
        <div><h3>Hecho de a uno</h3><p>No hay línea de producción. Cada pieza la armo yo, y por eso hay un límite de cuántas puedo tener en el taller a la vez.</p></div>
      " data-en="
        <div><h3>Drawn before it's cut</h3><p>Every commission is modelled in full 3D. You see the finished piece, at its real dimensions, before it exists and before you pay anything.</p></div>
        <div><h3>The cutting is optimised</h3><p>The parts list goes through an optimiser that nests every piece into the sheets. Less waste is less material you pay for.</p></div>
        <div><h3>One single figure</h3><p>The quote is closed, delivery included. No loose line items appearing at the end.</p></div>
        <div><h3>Made one at a time</h3><p>There's no production line. I build each piece myself, which is why there's a limit to how many can be in the shop at once.</p></div>
      "></div>
    </section>

    <!-- ---------- El encargo ---------- -->
    <section class="seccion">
      <h2 data-es="Cómo funciona un encargo" data-en="How a commission works"></h2>

      <ol class="pasos" data-es="
        <li><strong>Me escribes con la idea</strong>Aunque esté a medio cocinar. Una foto de referencia, o del espacio donde va, ayuda muchísimo.</li>
        <li><strong>Lo dibujo</strong>Te mando el modelo en 3D con las medidas reales, para que veas la pieza antes de que exista. Si hay que moverle algo, se mueve aquí, que es donde sale gratis.</li>
        <li><strong>Presupuesto en firme</strong>Una sola cifra, con todo incluido. Lleva fecha de validez porque el material se mueve, no por apurarte.</li>
        <li><strong>Anticipo y arranque</strong>50% para arrancar y 50% contra entrega. Las tres semanas se cuentan desde el anticipo, no desde que apruebas: el material se compra con ese anticipo.</li>
        <li><strong>Entrega</strong>Llevo la pieza y la monto. Si es algo que va anclado a la pared, lo dejo anclado.</li>
      " data-en="
        <li><strong>You write me with the idea</strong>Even half-baked. A reference photo, or one of the space it goes in, helps enormously.</li>
        <li><strong>I draw it</strong>I send you the 3D model at real dimensions, so you see the piece before it exists. If something needs moving, it moves here — which is where it's free.</li>
        <li><strong>A firm quote</strong>One single figure, everything included. It carries an expiry date because material prices move, not to rush you.</li>
        <li><strong>Deposit and start</strong>50% to start, 50% on delivery. The three weeks count from the deposit, not from your approval: the material is bought with that deposit.</li>
        <li><strong>Delivery</strong>I bring the piece and mount it. If it anchors to a wall, I leave it anchored.</li>
      "></ol>
    </section>

    <!-- ---------- Materiales ---------- -->
    <section class="seccion">
      <h2 data-es="Con qué trabajo" data-en="What I work with"></h2>
      <ul class="lista-marcas" data-es="
        <li><b>Contraenchapado de pino</b><span>El caballo de batalla. Estable, aguanta peso y no trabaja como la tabla maciza. De aquí sale la mayoría de los muebles.</span></li>
        <li><b>Pino macizo</b><span>Para estructuras, listones y todo lo que tenga que cargar. Con el tiempo toma un tono más dorado.</span></li>
        <li><b>Samán</b><span>Madera dura y de veta muy marcada. Para piezas pequeñas donde la madera es el protagonista.</span></li>
        <li><b>Fibrocemento y cerámica</b><span>Cuando la pieza tiene que aguantar agua, calor o un enchape que no se agriete.</span></li>
        <li><b>Acabados</b><span>Crudo, sellado, poliuretano o aceite de linaza. Cada uno cambia el precio y cambia cómo envejece la pieza; lo conversamos según dónde va a vivir.</span></li>
      " data-en="
        <li><b>Pine plywood</b><span>The workhorse. Stable, carries weight, and doesn't move the way solid board does. Most of the furniture comes from here.</span></li>
        <li><b>Solid pine</b><span>For structure, rails and anything that has to carry load. It takes on a more golden tone over time.</span></li>
        <li><b>Samán</b><span>A hard wood with very pronounced grain. For small pieces where the wood is the point.</span></li>
        <li><b>Fibre cement and ceramic</b><span>When a piece has to take water, heat, or a cladding that mustn't crack.</span></li>
        <li><b>Finishes</b><span>Unfinished, sealed, polyurethane or linseed oil. Each one changes the price and changes how the piece ages; we talk it through based on where it's going to live.</span></li>
      "></ul>
    </section>

    <!-- ---------- Límites honestos ---------- -->
    <section class="seccion">
      <h2 data-es="Lo que no hago" data-en="What I don't do"></h2>
      <div class="prosa" style="margin-top:1.4rem" data-es="
        <p>Prefiero decirlo de entrada que decepcionarte a mitad de camino.</p>
        <p>No copio un mueble de catálogo pieza por pieza para que salga más barato: si te gusta algo de una tienda, trabajamos sobre esa idea, no sobre ese precio. Tampoco compito con el mueble importado de producción en serie, porque no juego el mismo juego.</p>
        <p>No repito un encargo idéntico para otro cliente. Sobre la misma idea sí, igualito no.</p>
        <p>Y no arranco nada sin el modelo aprobado. Es lo que hace que no haya sorpresas después.</p>
      " data-en="
        <p>I'd rather say it up front than disappoint you halfway through.</p>
        <p>I don't copy a catalogue piece part for part to come in cheaper: if you like something from a store, we work from that idea, not from that price. And I don't compete with mass-produced imported furniture, because I'm not playing the same game.</p>
        <p>I don't repeat a commission identically for another client. From the same idea, yes; exactly the same, no.</p>
        <p>And I don't start anything without an approved model. That's what keeps the surprises out later.</p>
      "></div>
    </section>
