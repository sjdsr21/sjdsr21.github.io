      <!-- 2026-08-12 · Corregido por él. El taller NO era de su

      <div class="prosa" data-es="
        <p>Soy Santiago. Trabajo la madera en Caracas, en un espacio que era un simple depósito y que he ido habilitando poco a poco: primero para que cupieran las herramientas, después para que fuera un sitio cómodo donde crear sin tantas limitaciones.</p>
        <p>Aprendí solo, con ayuda de YouTube, haciendo, equivocándome y rehaciendo. No vengo de una escuela de ebanistería ni de una familia de ebanistas: vengo de trabajar en un estacionamiento y de muchas horas averiguando por qué una pieza salió torcida, por qué no funciona bien, o por qué una idea funcionaba mejor en mi cabeza.</p>
        <p>De ahí sale el nombre. Prototipar es hacer una primera versión de algo y mejorarla en la siguiente. Es como trabajo y es como aprendí.</p>
      " data-en="
        <p>I'm Santiago. I work wood in Caracas, in a space that was just a storage room and that I've been fitting out little by little: first so the tools would fit, then so it would be a comfortable place to make things without so many limits.</p>
        <p>I taught myself, with YouTube's help — by doing it, getting it wrong, and doing it again. I didn't come out of a cabinetmaking school or a family of cabinetmakers: I came out of working in a parking garage and a lot of hours working out why a piece came out crooked, why it doesn't work right, or why an idea worked better in my head.</p>
        <p>That's where the name comes from. To prototype is to make a first version of something and improve it on the next one. It's how I work and it's how I learned.</p>
      "></div>
    </section>

    <!-- ---------- El encargo ---------- -->
    <section class="seccion">
      <h2 data-es="Cómo funciona un encargo" data-en="How a commission works"></h2>

      <!-- 2026-08-12 · Reescrito por él. Cambios de fondo, no de
           estilo: el plazo cuenta desde el anticipo (no desde la
           aprobación), entró un paso nuevo de avances, y la
           entrega dejó de prometer montaje siempre — depende de lo
           que se acuerde al principio. -->
      <ol class="pasos" data-es="
        <li><strong>Me escribes con la idea</strong>Aunque esté incompleta. Una foto de referencia, el espacio donde va, medidas aproximadas: todo eso ayuda muchísimo.</li>
        <li><strong>Lo dibujo</strong>Te mando una representación visual en 3D, con las medidas reales aproximadas, para que veas la pieza antes de que exista. Si hay que ajustarle algo, se ajusta aquí.</li>
        <li><strong>Presupuesto en firme</strong>Una sola cifra, sin elementos escondidos. Lleva fecha de validez porque el material se mueve, no por apurarte.</li>
        <li><strong>Anticipo y arranque</strong>50% para arrancar y 50% contra entrega. El tiempo de entrega se cuenta desde el anticipo de arranque, no desde que apruebas: el material se compra con ese anticipo.</li>
        <li><strong>Te voy contando</strong>Mientras la pieza se hace, te mando avances: cómo va quedando, en qué punto está y cualquier decisión que valga la pena consultarte por el camino.</li>
        <li><strong>Entrega</strong>Según lo que hayamos acordado al principio, llevo la pieza y la monto, la dejo anclada donde va, o te la entrego lista para que la recibas como prefieras.</li>
      " data-en="
        <li><strong>You write me with the idea</strong>Even if it's incomplete. A reference photo, the space it goes in, rough measurements: all of it helps enormously.</li>
        <li><strong>I draw it</strong>I send you a visual 3D representation, at approximate real dimensions, so you see the piece before it exists. If something needs adjusting, it gets adjusted here.</li>
        <li><strong>A firm quote</strong>One single figure, with nothing hidden in it. It carries an expiry date because material prices move, not to rush you.</li>
        <li><strong>Deposit and start</strong>50% to start, 50% on delivery. The lead time counts from the starting deposit, not from your approval: the material is bought with that deposit.</li>
        <li><strong>I keep you posted</strong>While the piece is being made I send you progress: how it's coming along, where it stands, and any decision worth checking with you along the way.</li>
        <li><strong>Delivery</strong>Depending on what we agreed at the start, I bring the piece and mount it, leave it anchored where it goes, or hand it over ready for you to receive however suits you.</li>
      "></ol>
    </section>

    <!-- ---------- Materiales ---------- -->
    <section class="seccion">
      <h2 data-es="Con qué trabajo" data-en="What I work with"></h2>
      <ul class="lista-marcas" data-es="
        <li><b>Contraenchapado de pino</b><span>El caballo de batalla. Estable, aguanta peso y no trabaja como la tabla maciza. De aquí sale la mayoría de los muebles.</span></li>
        <li><b>Pino macizo</b><span>Para estructuras, listones y todo lo que tenga que cargar. Con el tiempo toma un tono más dorado.</span></li>
        <li><b>Samán</b><span>Madera dura y de veta muy marcada. Para piezas pequeñas donde la madera es el protagonista.</span></li>
        <li><b>Fibrocemento y cerámica</b><span>Cuando la pieza tiene que aguantar agua, calor o un enchape que no se agriete.</span></li>
        <li><b>Acabados</b><span>Crudo, sellado, poliuretano o aceite de linaza. Cada uno cambia el precio y cambia cómo envejece la pieza; lo conversamos según dónde va a vivir.</span></li>
      " data-en="
        <li><b>Pine plywood</b><span>The workhorse. Stable, carries weight, and doesn't move the way solid board does. Most of the furniture comes from here.</span></li>
        <li><b>Solid pine</b><span>For structure, rails and anything that has to carry load. It takes on a more golden tone over time.</span></li>
        <li><b>Samán</b><span>A hard wood with very pronounced grain. For small pieces where the wood is the point.</span></li>
        <li><b>Fibre cement and ceramic</b><span>When a piece has to take water, heat, or a cladding that mustn't crack.</span></li>
        <li><b>Finishes</b><span>Unfinished, sealed, polyurethane or linseed oil. Each one changes the price and changes how the piece ages; we talk it through based on where it's going to live.</span></li>
      "></ul>
    </section>

    <!-- ---------- Límites honestos ---------- -->
    <section class="seccion">
      <h2 data-es="Lo que no hago" data-en="What I don't do"></h2>
      <div class="prosa" style="margin-top:1.4rem" data-es="
        <p>Prefiero decirlo de entrada que decepcionarte a mitad de camino.</p>
        <p>No copio un mueble de catálogo pieza por pieza para que salga más barato: si te gusta algo de una tienda, trabajamos sobre esa idea, no sobre ese precio. Tampoco compito con el mueble importado de producción en serie, porque no juego el mismo juego.</p>
        <p>No repito un encargo idéntico para otro cliente. Sobre la misma idea sí, igualito no.</p>
        <p>Y no arranco nada sin el modelo aprobado. Es lo que hace que no haya sorpresas después.</p>
      " data-en="
        <p>I'd rather say it up front than disappoint you halfway through.</p>
        <p>I don't copy a catalogue piece part for part to come in cheaper: if you like something from a store, we work from that idea, not from that price. And I don't compete with mass-produced imported furniture, because I'm not playing the same game.</p>
        <p>I don't repeat a commission identically for another client. From the same idea, yes; exactly the same, no.</p>
        <p>And I don't start anything without an approved model. That's what keeps the surprises out later.</p>
      "></div>
    </section>
