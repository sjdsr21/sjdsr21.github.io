      <div class="prosa intro-taller__texto" data-es="
        <p>Soy Santiago. Decidí dedicarme a la carpintería después de graduarme como economista porque me resultó imposible contener las ansias de materializar mis inventos y encontrar soluciones a problemas en el mundo físico, donde hay contacto humano y aquél sentimiento de asombro al ver cómo se transforma un material crudo en una pieza bella y funcional.</p>
        <p>Con el apoyo de mi familia y algunas herramientas de mi papá, comencé a exprimir esos jugos creativos dentro de mí, trabajando en un estacionamiento. Y en YouTube encontré un nicho que me atrapó con su encanto y pasión: carpinteros (y no carpinteros) con la dichosa habilidad de contar las historias de sus procesos creativos. Son mis mentores, y ni siquiera me conocen. Mi otro gran mentor ha sido el fracaso, repetido e incesante, sin el cual no es posible llegar a ningún lado al que valga la pena llegar, o así me ha parecido. Ahora me intento regocijar en su dulce amargura.</p>
        <p>“Prototipo” es una palabra clave. Diría que su significado me ha brindado algo de paz en el ejercicio de mi práctica porque diseñar algo por primera vez, sea lo que sea, está casi siempre condenado a fallar por algún lado. He comprendido que se trata de una parte natural e inevitable del proceso; que el resultado de hoy es el prototipo de algo más grande que se gesta ‘más allá’, por encima de esta pieza o proyecto, y por encima de este día, semana, mes o año. Y ¿quién sabe?, quizás al descuidarnos descubramos eventualmente que somos felices por entenderlo así...</p>
        <p class='firma'>— Santiago De Sousa, 2026</p>
      " data-en="
        <p>I'm Santiago. I decided to devote myself to woodworking after graduating as an economist, because I found it impossible to hold back the urge to give physical form to my inventions and to find solutions to problems in the physical world, where there is human contact and that feeling of wonder at watching a raw material turn into a beautiful, functional piece.</p>
        <p>With my family's support and a few of my dad's tools, I started squeezing out those creative juices inside me, working out of a parking garage. And on YouTube I found a niche that caught me with its charm and passion: woodworkers (and non-woodworkers) with the blessed gift of telling the stories of their creative processes. They are my mentors, and they don't even know me. My other great mentor has been failure, repeated and relentless, without which there's no getting anywhere worth getting to, or so it has seemed to me. Now I try to revel in its sweet bitterness.</p>
        <p>“Prototype” is a key word. I'd say its meaning has brought me some peace in my practice, because designing something for the first time, whatever it is, is almost always doomed to fail somewhere. I've come to understand that this is a natural, unavoidable part of the process; that today's result is the prototype of something bigger taking shape ‘beyond’, above this piece or project, and above this day, week, month or year. And who knows? Maybe, when we least expect it, we'll eventually discover that we're happy for understanding it that way...</p>
        <p class='firma'>— Santiago De Sousa, 2026</p>
      "></div>

      <h2 data-es="Cómo funciona un encargo" data-en="How a commission works"></h2>

      <!-- 2026-08-12 · Reescrito por él. Cambios de fondo, no de
           estilo: el plazo cuenta desde el anticipo (no desde la
           aprobación), entró un paso nuevo de avances, y la
           entrega dejó de prometer montaje siempre — depende de lo
           que se acuerde al principio.
           2026-09-14 · «Presupuesto en firme» pasa a «Presupuesto claro»
           (él). Y el enlace a la propuesta se destaca: siena, subrayado
           grueso y una flecha hacia abajo, porque la propuesta está más
           abajo en esta misma página. -->
      <ol class="pasos" data-es="
        <li><strong>Me escribes con la idea</strong>Aunque esté incompleta. Una foto de referencia, el espacio donde va, medidas aproximadas: todo eso ayuda muchísimo.</li>
        <li><strong>Lo dibujo</strong>Te mando una representación visual en 3D, con las medidas reales aproximadas, para que veas la pieza antes de que exista. Si hay que ajustarle algo, se ajusta aquí. <a class='pasos__ver' href='#materiales'>Mira con cuáles materiales trabajo<svg class='pasos__flecha' viewBox='0 0 12 16' aria-hidden='true' focusable='false'><path d='M6 1v13M1.5 9.5 6 14l4.5-4.5'/></svg></a></li>
        <li><strong>Presupuesto claro</strong>Una sola cifra, sin elementos escondidos. Lleva fecha de validez porque el material se mueve, no por apurarte. <a class='pasos__ver' href='#propuesta'>Mira cómo es una propuesta<svg class='pasos__flecha' viewBox='0 0 12 16' aria-hidden='true' focusable='false'><path d='M6 1v13M1.5 9.5 6 14l4.5-4.5'/></svg></a></li>
        <li><strong>Anticipo y arranque</strong>50% para arrancar y 50% contra entrega. El tiempo de entrega se cuenta desde el anticipo de arranque, no desde que apruebas: el material se compra con ese anticipo.</li>
        <li><strong>Te voy contando</strong>Mientras la pieza se hace, te mando avances: cómo va quedando, en qué punto está y cualquier decisión que valga la pena consultarte por el camino.</li>
        <li><strong>Entrega</strong>Según lo que hayamos acordado al principio, llevo la pieza y la monto, la dejo anclada donde va, o te la entrego lista para que la recibas como prefieras.</li>
      " data-en="
        <li><strong>You write me with the idea</strong>Even if it's incomplete. A reference photo, the space it goes in, rough measurements: all of it helps enormously.</li>
        <li><strong>I draw it</strong>I send you a visual 3D representation, at approximate real dimensions, so you see the piece before it exists. If something needs adjusting, it gets adjusted here. <a class='pasos__ver' href='#materiales'>See the materials I work with<svg class='pasos__flecha' viewBox='0 0 12 16' aria-hidden='true' focusable='false'><path d='M6 1v13M1.5 9.5 6 14l4.5-4.5'/></svg></a></li>
        <li><strong>A clear quote</strong>One single figure, with nothing hidden in it. It carries an expiry date because material prices move, not to rush you. <a class='pasos__ver' href='#propuesta'>See what a proposal looks like<svg class='pasos__flecha' viewBox='0 0 12 16' aria-hidden='true' focusable='false'><path d='M6 1v13M1.5 9.5 6 14l4.5-4.5'/></svg></a></li>
        <li><strong>Deposit and start</strong>50% to start, 50% on delivery. The lead time counts from the starting deposit, not from your approval: the material is bought with that deposit.</li>
        <li><strong>I keep you posted</strong>While the piece is being made I send you progress: how it's coming along, where it stands, and any decision worth checking with you along the way.</li>
        <li><strong>Delivery</strong>Depending on what we agreed at the start, I bring the piece and mount it, leave it anchored where it goes, or hand it over ready for you to receive however suits you.</li>
      "></ol>
    </section>

    <!-- ---------- Materiales ---------- -->
    <section class="seccion" id="materiales">
      <h2 data-es="Con qué trabajo" data-en="What I work with"></h2>
      <!-- 2026-08-14 · Reordenado por él: primero la madera
           sólida, luego los aglomerados, luego metales y por
           último pintura y barnices. Antes iba mezclado y el
           contraenchapado abría la lista. -->
      <ul class="lista-marcas" data-es="
        <li><svg class='mat-icono' aria-hidden='true' focusable='false'><use href='#mat-madera'/></svg><b>Madera sólida</b><span>Pino macizo para estructuras, listones y todo lo que tenga que cargar; con el tiempo toma un tono más dorado. Y samán, dura y de veta muy marcada, para piezas pequeñas donde la madera es la protagonista.</span></li>
        <li><svg class='mat-icono' aria-hidden='true' focusable='false'><use href='#mat-aglomerados'/></svg><b>Aglomerados</b><span>Contraenchapados, compuestos, MDF, melamina y similares. Son el caballo de batalla: estables, aguantan peso y no trabajan como la tabla maciza. De aquí sale la mayoría de los muebles.</span></li>
        <li><svg class='mat-icono' aria-hidden='true' focusable='false'><use href='#mat-metales'/></svg><b>Metales</b><span>Herrería ligera: manejo las máquinas de soldar, y trabajo el hierro y el aluminio. Para bases, estructuras y refuerzos donde la madera sola no da.</span></li>
        <li><svg class='mat-icono' aria-hidden='true' focusable='false'><use href='#mat-pintura'/></svg><b>Pintura y barnices</b><span>Crudo, sellado, laca, poliuretano o aceite de linaza. Cada uno cambia el precio y cambia cómo envejece la pieza; lo conversamos según dónde va a vivir.</span></li>
      " data-en="
        <li><svg class='mat-icono' aria-hidden='true' focusable='false'><use href='#mat-madera'/></svg><b>Solid wood</b><span>Solid pine for structure, rails and anything that has to carry load; it takes on a more golden tone over time. And samán, hard and strongly grained, for small pieces where the wood is the point.</span></li>
        <li><svg class='mat-icono' aria-hidden='true' focusable='false'><use href='#mat-aglomerados'/></svg><b>Engineered boards</b><span>Plywood, composites, MDF, melamine and the like. They're the workhorse: stable, they carry weight and they don't move the way solid board does. Most of the furniture comes from here.</span></li>
        <li><svg class='mat-icono' aria-hidden='true' focusable='false'><use href='#mat-metales'/></svg><b>Metals</b><span>Light metalwork: I run the welders, and I work iron and aluminium. For bases, frames and reinforcement where wood alone won't do.</span></li>
        <li><svg class='mat-icono' aria-hidden='true' focusable='false'><use href='#mat-pintura'/></svg><b>Paint and varnish</b><span>Unfinished, sealed, lacquered, polyurethane or linseed oil. Each one changes the price and changes how the piece ages; we talk it through based on where it's going to live.</span></li>
      "></ul>
    </section>

    <section class="seccion" id="maderas">
      <h2 data-es="Las maderas" data-en="The woods"></h2>
      <p data-es="Estas son las especies con las que trabajo normalmente. Casi cualquier pieza del catálogo se puede hacer en otra de ellas — cambia el precio, el peso y el carácter, y lo conversamos antes."
         data-en="These are the species I normally work with. Almost any piece in the catalogue can be made in a different one — it changes the price, the weight and the character, and we talk it through first."></p>

      <ul class="maderas" data-es="
        <li><img style=&quot;--m:#D9B77A&quot; src=&quot;img/maderas/pino.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Pino</b><em>Pinus caribaea · Pino Caribe</em><span>Blanda y liviana, de veta recta y nudos vivos. Es la de estructura: barata, fácil de trabajar y de repuesto seguro. Con los años dora.</span></li>
        <li><img style=&quot;--m:#7F5435&quot; src=&quot;img/maderas/saman.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Samán</b><em>Samanea saman</em><span>Dura, pesada y de veta muy marcada, con el albura clara contrastando contra un corazón chocolate. Cuando la madera es lo que se mira, es ésta.</span></li>
        <li><img style=&quot;--m:#C9A882&quot; src=&quot;img/maderas/apamate.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Apamate</b><em>Tabebuia rosea</em><span>Dureza media y tono rosado tostado, de veta tranquila. Estable y agradecida al cepillo; buena para piezas que se tocan mucho.</span></li>
        <li><img style=&quot;--m:#A9673C&quot; src=&quot;img/maderas/cedro.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Cedro</b><em>Cedrela odorata</em><span>Liviana para lo rojiza que es, aromática, y de las más nobles para tallar. Clásica de mueblería fina. Se raya con facilidad: no es para una tabla de picar.</span></li>
        <li><img style=&quot;--m:#8A4F32&quot; src=&quot;img/maderas/caoba.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Caoba</b><em>Swietenia macrophylla</em><span>Pardo rojiza, que se oscurece y gana brillo con los años. Estable, dócil al trabajo y fácil de pulir: la madera clásica del mueble fino.</span></li>
        <li><img style=&quot;--m:#7A3526&quot; src=&quot;img/maderas/aurora.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Aurora</b><em>Erisma uncinatum · mureillo</em><span>Rojiza, oscura y muy liviana. Astilla bastante al trabajarla.</span></li>
        <li><img style=&quot;--m:#8A6B2F&quot; src=&quot;img/maderas/puy.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Puy</b><em>Tabebuia serratifolia</em><span>Muy dura y densa, pardo oliva. Aguanta a la intemperie y el uso rudo mejor que casi cualquier otra de aquí. Cuesta trabajarla, y se nota en el filo de las herramientas.</span></li>
        <li><img style=&quot;--m:#A9814B&quot; src=&quot;img/maderas/teca.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Teca</b><em>Tectona grandis</em><span>Dorada, grasosa al tacto por sus aceites naturales, y la más estable de todas frente a la humedad. Por eso es la de cocina y la de exterior.</span></li>
        <li><img style=&quot;--m:#8B4A2B&quot; src=&quot;img/maderas/algarrobo.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Algarrobo</b><em>Hymenaea courbaril</em><span>Muy dura y pesada, de un rojo anaranjado que se oscurece con la luz. Pesa de verdad: una tabla grande se siente en la mano.</span></li>
        <li><img style=&quot;--m:#6B3F7A&quot; src=&quot;img/maderas/nazareno.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Nazareno</b><em>Peltogyne spp.</em><span>La morada. Sale parda del corte y vira a violeta con el aire, luego calma hacia un vino oscuro. Muy dura. Se usa poco y en poca cantidad, como acento.</span></li>
        <li><img style=&quot;--m:#D8C39A&quot; src=&quot;img/maderas/melina.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Melina</b><em>Gmelina arborea</em><span>Clara, liviana y de crecimiento rápido, con veta discreta. Alternativa al pino cuando se quiere un tono más pálido y parejo.</span></li>
      " data-en="
        <li><img style=&quot;--m:#D9B77A&quot; src=&quot;img/maderas/pino.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Pine</b><em>Pinus caribaea · Caribbean pine</em><span>Soft and light, straight-grained with live knots. This is the structural one: cheap, easy to work and easy to replace. It turns golden over the years.</span></li>
        <li><img style=&quot;--m:#7F5435&quot; src=&quot;img/maderas/saman.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Monkeypod</b><em>Samanea saman</em><span>Hard, heavy and strongly figured, pale sapwood set against a chocolate heart. When the wood is the thing you look at, it's this one.</span></li>
        <li><img style=&quot;--m:#C9A882&quot; src=&quot;img/maderas/apamate.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Apamate</b><em>Tabebuia rosea</em><span>Medium hardness, a toasted rose tone and quiet grain. Stable and rewarding under the plane; good for pieces that get handled a lot.</span></li>
        <li><img style=&quot;--m:#A9673C&quot; src=&quot;img/maderas/cedro.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Spanish cedar</b><em>Cedrela odorata</em><span>Light for how red it is, aromatic, and one of the finest to carve. A classic of good cabinetwork. It marks easily, so not for a cutting board.</span></li>
        <li><img style=&quot;--m:#8A4F32&quot; src=&quot;img/maderas/caoba.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Mahogany</b><em>Swietenia macrophylla</em><span>Reddish brown that darkens and gains lustre with age. Stable, easy to work and to polish: the classic fine-furniture wood.</span></li>
        <li><img style=&quot;--m:#7A3526&quot; src=&quot;img/maderas/aurora.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Aurora</b><em>Erisma uncinatum · mureillo</em><span>Reddish, dark and very light. It splinters quite a bit when worked.</span></li>
        <li><img style=&quot;--m:#8A6B2F&quot; src=&quot;img/maderas/puy.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Ipê</b><em>Tabebuia serratifolia</em><span>Very hard and dense, olive brown. It stands up to weather and rough use better than almost anything else here. Hard on tools, and you feel it on the edge.</span></li>
        <li><img style=&quot;--m:#A9814B&quot; src=&quot;img/maderas/teca.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Teak</b><em>Tectona grandis</em><span>Golden, faintly oily to the touch from its natural resins, and the most stable of all against moisture. That's why it's the kitchen and outdoor wood.</span></li>
        <li><img style=&quot;--m:#8B4A2B&quot; src=&quot;img/maderas/algarrobo.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Jatoba</b><em>Hymenaea courbaril</em><span>Very hard and heavy, an orange red that darkens with light. It genuinely weighs: you feel a large board in the hand.</span></li>
        <li><img style=&quot;--m:#6B3F7A&quot; src=&quot;img/maderas/nazareno.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Purpleheart</b><em>Peltogyne spp.</em><span>The purple one. It comes off the saw brown, turns violet in the air, then settles toward dark wine. Very hard. Used sparingly, as an accent.</span></li>
        <li><img style=&quot;--m:#D8C39A&quot; src=&quot;img/maderas/melina.webp&quot; alt=&quot;&quot; loading=&quot;lazy&quot;><b>Gmelina</b><em>Gmelina arborea</em><span>Pale, light and fast-growing, with discreet grain. An alternative to pine when you want a paler, more even tone.</span></li>
      "></ul>

      <!-- Crédito de las fotos. El del puy es OBLIGATORIO (CC BY-SA 3.0:
           autor, enlace a la licencia y aviso de que se recortó). Si esa
           foto sale, esta línea se puede simplificar; si entra otra de
